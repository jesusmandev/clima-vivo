<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clima Dinámico</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Work+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #1a1a2e;
            --text-color: #fff;
            --accent-color: #f39c12;
            --gradient-color-1: #FF6B6B;
            --gradient-color-2: #4ECDC4;
            --gradient-color-3: #FFE66D;
        }

        body {
            font-family: 'Work Sans', sans-serif;
            overflow-x: hidden;
            transition: background 1.5s ease;
            min-height: 100vh;
            position: relative;
        }

        /* Cielo de día */
        .day {
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 50%, #FFE6CC 100%);
        }

        /* Cielo de noche */
        .night {
            background: linear-gradient(to bottom, #0F2027 0%, #203A43 50%, #2C5364 100%);
        }

        /* Cielo nublado */
        .cloudy {
            background: linear-gradient(to bottom, #606c88 0%, #3f4c6b 100%);
        }

        /* Cielo lluvioso */
        .rainy {
            background: linear-gradient(to bottom, #373B44 0%, #4286f4 50%, #73C2FB 100%);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 20px;
            position: relative;
            z-index: 10;
        }

        header {
            text-align: center;
            padding: 60px 20px;
            animation: fadeInDown 1s ease;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(3rem, 8vw, 7rem);
            font-weight: 900;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #FF6B6B, #4ECDC4, #FFE66D, #FF6B6B);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -2px;
            animation: gradientShift 8s ease infinite, floatTitle 4s ease-in-out infinite;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2));
        }
        
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        @keyframes floatTitle {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
        }

        .subtitle {
            font-size: clamp(1.2rem, 2.5vw, 1.8rem);
            font-weight: 300;
            letter-spacing: 4px;
            text-transform: uppercase;
            opacity: 0.9;
            background: linear-gradient(90deg, #FF6B6B, #4ECDC4, #FFE66D);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: slideIn 1.5s ease-out 0.3s both;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .weather-card {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 50px;
            margin: 40px auto;
            max-width: 800px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3), 0 0 30px rgba(255, 107, 107, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.2);
            animation: fadeInUp 1s ease 0.3s both, pulseGlow 4s ease-in-out infinite 1s;
            transition: all 0.3s ease;
        }
        
        @keyframes pulseGlow {
            0%, 100% {
                box-shadow: 0 20px 60px rgba(0,0,0,0.3), 0 0 30px rgba(255, 107, 107, 0.2);
            }
            50% {
                box-shadow: 0 20px 60px rgba(0,0,0,0.3), 0 0 50px rgba(78, 205, 196, 0.3);
            }
        }

        .weather-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 30px;
            margin-top: 30px;
        }

        .info-box {
            text-align: center;
            padding: 20px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            transition: transform 0.3s ease, background 0.3s ease;
        }

        .info-box:hover {
            transform: translateY(-8px) scale(1.05);
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 30px rgba(78, 205, 196, 0.2);
        }

        .info-label {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            opacity: 0.8;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #FFE66D, #4ECDC4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: fadeInLabel 0.8s ease;
        }

        .info-value {
            font-size: 2.5rem;
            font-weight: 600;
            font-family: 'Playfair Display', serif;
            background: linear-gradient(135deg, #FF6B6B, #FFE66D);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: scaleIn 0.8s ease;
        }
        
        @keyframes fadeInLabel {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes scaleIn {
            from {
                transform: scale(0.5);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .temperature {
            font-size: clamp(4rem, 10vw, 8rem) !important;
            margin: 20px 0;
            text-align: center;
            font-weight: 900;
            background: linear-gradient(180deg, #FF6B6B, #FF8E72, #FFE66D);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: temperatureFloat 3s ease-in-out infinite, glowPulse 2s ease-in-out infinite;
            text-shadow: 0 0 30px rgba(255, 107, 107, 0.3);
            filter: drop-shadow(0 0 20px rgba(255, 107, 107, 0.2));
        }
        
        @keyframes temperatureFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        
        @keyframes glowPulse {
            0%, 100% { text-shadow: 0 0 20px rgba(255, 107, 107, 0.3); }
            50% { text-shadow: 0 0 40px rgba(78, 205, 196, 0.3); }
        }

        /* Animaciones del cielo */
        .sky-element {
            position: fixed;
            pointer-events: none;
            z-index: 1;
        }

        /* Sol */
        .sun {
            width: 150px;
            height: 150px;
            background: radial-gradient(circle, #FFE66D 0%, #FF8E72 50%, #FF6B6B 100%);
            border-radius: 50%;
            top: 10%;
            right: 15%;
            box-shadow: 0 0 80px #FFE66D, 0 0 120px rgba(255, 107, 107, 0.6), inset -30px -30px 60px rgba(255, 107, 107, 0.3);
            animation: sunrise 2s ease, float 6s ease-in-out infinite, sunPulse 3s ease-in-out infinite;
        }

        @keyframes sunrise {
            from {
                transform: translateY(100vh) scale(0.5);
                opacity: 0;
            }
            to {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }
        
        @keyframes sunPulse {
            0%, 100% {
                box-shadow: 0 0 80px #FFE66D, 0 0 120px rgba(255, 107, 107, 0.6);
                transform: scale(1);
            }
            50% {
                box-shadow: 0 0 100px #FFE66D, 0 0 150px rgba(255, 107, 107, 0.8);
                transform: scale(1.05);
            }
        }

        /* Luna */
        .moon {
            width: 120px;
            height: 120px;
            background: radial-gradient(circle at 30% 30%, #ffffff 0%, #e8e8ff 40%, #b0c4ff 100%);
            border-radius: 50%;
            top: 10%;
            right: 15%;
            box-shadow: 0 0 60px rgba(176, 196, 255, 0.8), 0 0 30px rgba(78, 205, 196, 0.4), inset -15px -15px 30px rgba(0,0,0,0.1);
            animation: moonrise 2s ease, float 8s ease-in-out infinite, moonGlow 3s ease-in-out infinite;
        }

        @keyframes moonrise {
            from {
                transform: translateY(-100vh) scale(0.3);
                opacity: 0;
            }
            to {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }
        
        @keyframes moonGlow {
            0%, 100% {
                box-shadow: 0 0 60px rgba(176, 196, 255, 0.8), 0 0 30px rgba(78, 205, 196, 0.4);
            }
            50% {
                box-shadow: 0 0 80px rgba(176, 196, 255, 1), 0 0 50px rgba(78, 205, 196, 0.6);
            }
        }

        /* Estrellas */
        .star {
            width: 3px;
            height: 3px;
            background: white;
            border-radius: 50%;
            position: fixed;
            animation: twinkle 3s ease-in-out infinite;
            box-shadow: 0 0 10px white;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* Nubes */
        .cloud {
            background: rgba(255, 255, 255, 0.85);
            border-radius: 100px;
            position: fixed;
            animation: float-cloud 20s linear infinite;
            filter: drop-shadow(0 10px 30px rgba(255, 107, 107, 0.2));
        }

        .cloud::before,
        .cloud::after {
            content: '';
            position: absolute;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 50%;
        }

        .cloud-1 {
            width: 120px;
            height: 40px;
            top: 15%;
            left: -150px;
        }

        .cloud-1::before {
            width: 50px;
            height: 50px;
            top: -25px;
            left: 10px;
        }

        .cloud-1::after {
            width: 60px;
            height: 60px;
            top: -30px;
            right: 20px;
        }

        .cloud-2 {
            width: 100px;
            height: 35px;
            top: 30%;
            left: -150px;
            animation-delay: 5s;
            animation-duration: 25s;
        }

        .cloud-2::before {
            width: 45px;
            height: 45px;
            top: -20px;
            left: 15px;
        }

        .cloud-2::after {
            width: 50px;
            height: 50px;
            top: -25px;
            right: 15px;
        }

        .cloud-3 {
            width: 140px;
            height: 45px;
            top: 50%;
            left: -150px;
            animation-delay: 10s;
            animation-duration: 30s;
        }

        .cloud-3::before {
            width: 55px;
            height: 55px;
            top: -28px;
            left: 20px;
        }

        .cloud-3::after {
            width: 65px;
            height: 65px;
            top: -32px;
            right: 25px;
        }

        @keyframes float-cloud {
            from {
                left: -200px;
            }
            to {
                left: 110%;
            }
        }

        /* Nubes oscuras para lluvia */
        .dark-cloud {
            background: rgba(70, 70, 80, 0.9);
        }

        .dark-cloud::before,
        .dark-cloud::after {
            background: rgba(70, 70, 80, 0.9);
        }

        /* Gotas de lluvia */
        .rain-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 2;
        }

        .raindrop {
            position: absolute;
            width: 2px;
            height: 20px;
            background: linear-gradient(to bottom, transparent, rgba(174, 214, 241, 0.8));
            animation: fall linear infinite;
        }

        @keyframes fall {
            to {
                transform: translateY(100vh);
            }
        }

        /* Botón de recarga */
        .reload-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 15px 30px;
            background: linear-gradient(135deg, rgba(255, 107, 107, 0.6), rgba(78, 205, 196, 0.6));
            backdrop-filter: blur(15px);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 50px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 100;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 8px 32px rgba(255, 107, 107, 0.3), 0 0 20px rgba(78, 205, 196, 0.2);
            animation: buttonFloat 3s ease-in-out infinite;
        }

        .reload-btn:hover {
            background: linear-gradient(135deg, rgba(255, 107, 107, 0.9), rgba(78, 205, 196, 0.9));
            transform: scale(1.1) translateY(-3px);
            box-shadow: 0 12px 40px rgba(255, 107, 107, 0.5), 0 0 30px rgba(78, 205, 196, 0.4);
        }
        
        @keyframes buttonFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
        }

        /* Animaciones de entrada */
        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .loading {
            text-align: center;
            font-size: 1.5rem;
            padding: 100px 20px;
            background: linear-gradient(135deg, #FF6B6B, #4ECDC4, #FFE66D);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 600;
            animation: fadeInUp 0.8s ease;
        }

        .loading::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: ''; }
            40% { content: '.'; }
            60% { content: '..'; }
            80%, 100% { content: '...'; }
        }

        .error {
            text-align: center;
            padding: 50px 20px;
            color: #FF6B6B;
            font-size: 1.2rem;
            font-weight: 600;
            animation: shake 0.5s ease-in-out;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .weather-card {
                padding: 30px 20px;
            }
            
            .sun, .moon {
                width: 100px;
                height: 100px;
                top: 8%;
                right: 10%;
            }
        }
    </style>
</head>
<body class="day">
    <div class="container">
        <header>
            <h1>Clima Vivo</h1>
            <p class="subtitle">Conectado al mundo real</p>
        </header>

        <div id="app">
            <div class="loading">Cargando clima en tiempo real</div>
        </div>
    </div>

    <button class="reload-btn" onclick="loadWeather()">Actualizar Clima</button>

    <script>
        const API_KEY = 'YOUR_API_KEY_HERE';

        async function getLocation() {
            return new Promise((resolve, reject) => {
                if (!navigator.geolocation) {
                    reject('Geolocalización no soportada');
                }
                navigator.geolocation.getCurrentPosition(
                    position => resolve({
                        lat: position.coords.latitude,
                        lon: position.coords.longitude
                    }),
                    error => {
                        resolve({ lat: 4.7110, lon: -74.0721 });
                    }
                );
            });
        }

        async function getWeather(lat, lon) {
            const response = await fetch(
                `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m&timezone=auto`
            );
            return response.json();
        }

        function interpretWeatherCode(code) {
            if (code === 0) return { main: 'Despejado', description: 'Cielo despejado' };
            if (code <= 3) return { main: 'Parcialmente nublado', description: 'Algunas nubes' };
            if (code <= 48) return { main: 'Nublado', description: 'Cielo cubierto' };
            if (code <= 67) return { main: 'Lluvia', description: 'Lluvia' };
            if (code <= 77) return { main: 'Nieve', description: 'Nevada' };
            if (code <= 99) return { main: 'Tormenta', description: 'Tormenta eléctrica' };
            return { main: 'Desconocido', description: 'Clima desconocido' };
        }

        function isNightTime() {
            const hour = new Date().getHours();
            return hour < 6 || hour > 20;
        }

        function createSkyElements(weatherMain, isNight) {
            document.querySelectorAll('.sky-element').forEach(el => el.remove());
            document.querySelectorAll('.rain-container').forEach(el => el.remove());

            const body = document.body;

            if (isNight) {
                body.className = 'night';
                
                const moon = document.createElement('div');
                moon.className = 'sky-element moon';
                body.appendChild(moon);

                for (let i = 0; i < 100; i++) {
                    const star = document.createElement('div');
                    star.className = 'sky-element star';
                    star.style.top = `${Math.random() * 70}%`;
                    star.style.left = `${Math.random() * 100}%`;
                    star.style.animationDelay = `${Math.random() * 3}s`;
                    body.appendChild(star);
                }

            } else if (weatherMain.includes('Lluvia') || weatherMain.includes('Tormenta')) {
                body.className = 'rainy';
                
                for (let i = 1; i <= 3; i++) {
                    const cloud = document.createElement('div');
                    cloud.className = `sky-element cloud dark-cloud cloud-${i}`;
                    body.appendChild(cloud);
                }

                const rainContainer = document.createElement('div');
                rainContainer.className = 'rain-container';
                
                for (let i = 0; i < 100; i++) {
                    const drop = document.createElement('div');
                    drop.className = 'raindrop';
                    drop.style.left = `${Math.random() * 100}%`;
                    drop.style.animationDuration = `${0.5 + Math.random() * 0.5}s`;
                    drop.style.animationDelay = `${Math.random() * 2}s`;
                    rainContainer.appendChild(drop);
                }
                
                body.appendChild(rainContainer);

            } else if (weatherMain.includes('Nublado') || weatherMain.includes('nubes')) {
                body.className = 'cloudy';
                
                const sun = document.createElement('div');
                sun.className = 'sky-element sun';
                sun.style.opacity = '0.5';
                body.appendChild(sun);

                for (let i = 1; i <= 3; i++) {
                    const cloud = document.createElement('div');
                    cloud.className = `sky-element cloud cloud-${i}`;
                    body.appendChild(cloud);
                }

            } else {
                body.className = 'day';
                
                const sun = document.createElement('div');
                sun.className = 'sky-element sun';
                body.appendChild(sun);

                const cloud = document.createElement('div');
                cloud.className = 'sky-element cloud cloud-1';
                body.appendChild(cloud);
            }
        }

        function displayWeather(data) {
            const current = data.current;
            const weather = interpretWeatherCode(current.weather_code);
            const isNight = isNightTime();
            
            const temp = Math.round(current.temperature_2m);
            const humidity = current.relative_humidity_2m;
            const windSpeed = current.wind_speed_10m;

            createSkyElements(weather.main, isNight);

            const html = `
                <div class="weather-card">
                    <h2 style="text-align: center; font-size: 2.5rem; margin-bottom: 10px; background: linear-gradient(135deg, #FF6B6B, #FFE66D); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; font-family: 'Playfair Display', serif;">
                        ${weather.main}
                    </h2>
                    <p style="text-align: center; font-size: 1.2rem; opacity: 0.9; color: #fff; margin-bottom: 20px; animation: slideIn 0.8s ease;">
                        ${weather.description}
                    </p>
                    
                    <div class="temperature">${temp}°C</div>
                    
                    <div class="weather-info">
                        <div class="info-box">
                            <div class="info-label">Humedad</div>
                            <div class="info-value">${humidity}%</div>
                        </div>
                        <div class="info-box">
                            <div class="info-label">Viento</div>
                            <div class="info-value">${windSpeed} km/h</div>
                        </div>
                        <div class="info-box">
                            <div class="info-label">Periodo</div>
                            <div class="info-value">${isNight ? 'Noche' : 'Día'}</div>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('app').innerHTML = html;
        }

        async function loadWeather() {
            try {
                document.getElementById('app').innerHTML = '<div class="loading">Cargando clima en tiempo real</div>';
                
                const location = await getLocation();
                const weatherData = await getWeather(location.lat, location.lon);
                
                displayWeather(weatherData);
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('app').innerHTML = `
                    <div class="error">
                        No se pudo cargar el clima. Por favor, verifica tu conexión e intenta de nuevo.
                    </div>
                `;
            }
        }

        loadWeather();
        setInterval(loadWeather, 600000);
    </script>
</body>
</html>
